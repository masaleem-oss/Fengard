name: website

# builds site/ with the real logo, fonts and screenshots and publishes it to github pages
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/logo.svg
      - docs/social-preview.png
      - docs/screenshots/**
      - internal/web/static/fonts/**
      - internal/web/static/img/icons.svg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: build
        run: sh site/build.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
